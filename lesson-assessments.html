<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Take a HouseLearning grade-level unit test in mathematics, computer science, or science.">
  <title>Grade Unit Test | HouseLearning</title>
  <link rel="stylesheet" href="lesson-assessments.css">
  <script src="lesson-progress.js" defer></script>
  <script src="lesson-assessments.js" defer></script>
</head>
<body>
  <header class="test-header">
    <a class="wordmark" href="index.html">HouseLearning</a>
    <a class="back-link" href="javascript:history.back()">Back to lesson</a>
  </header>
  <main class="test-main">
    <section class="test-intro" aria-labelledby="test-title">
      <p class="eyebrow">Grade-level assessment</p>
      <h1 id="test-title">Unit test</h1>
      <p id="test-description">Choose a subject and grade to begin.</p>
      <div class="test-selectors">
        <label>Subject<select id="subject-select"><option value="math">Mathematics</option><option value="cs">Computer science</option><option value="science">Science</option></select></label>
        <label>Grade<select id="grade-select"><option value="" selected>Select grade</option><option value="0">Kindergarten</option><option value="1">Grade 1</option><option value="2">Grade 2</option><option value="3">Grade 3</option><option value="4">Grade 4</option><option value="5">Grade 5</option><option value="6">Grade 6</option><option value="7">Grade 7</option><option value="8">Grade 8</option><option value="9">Grade 9</option><option value="10">Grade 10</option><option value="11">Grade 11</option><option value="12">Grade 12</option></select></label>
        <button class="primary-button" id="start-test" type="button">Start unit test</button>
      </div>
    </section>
    <section class="test-workspace" id="test-workspace" aria-live="polite">
      <div class="empty-state"><strong>Ready when you are.</strong><span>Each test has four questions and immediate feedback.</span></div>
    </section>
  </main>
</body>
</html>
