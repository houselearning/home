<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search HouseLearning Math and Science lessons for every grade from Kindergarten through Grade 12.">
  <link rel="canonical" href="https://www.houselearning.org/home/courses.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="courses.css">
  <link rel="stylesheet" href="calendar-theme.css">
  <script type="module" src="calendar-theme.mjs"></script>
  <script type="module" src="site-i18n.mjs"></script>
  <script src="https://houselearning.org/cookiebanner.js"></script>
  <title data-site-i18n-title="courses.title">Course Search | HouseLearning</title>
</head>
<body>
  <header class="course-header">
    <div class="course-header-inner">
      <a class="course-brand" href="./">HouseLearning Courses</a>
      <nav class="course-nav" aria-label="Primary">
        <a href="./" data-site-i18n="nav.home">Home</a>
        <a href="math-page.html" data-site-i18n="nav.math">Math</a>
        <a href="science-page.html" data-site-i18n="nav.science">Science</a>
        <a href="lesson-assessments.html" data-site-i18n="nav.assessments">Assessments</a>
        <a href="computer-science-page.html" data-site-i18n="nav.computing">Computer Science</a>
        <a href="games.html" data-site-i18n="nav.games">Games</a>
      </nav>
    </div>
  </header>
  <main class="course-main">
    <section class="course-heading" aria-labelledby="course-title">
      <h1 id="course-title" data-site-i18n="courses.heading">Find a lesson by subject, grade, or topic.</h1>
      <p data-site-i18n="courses.description">Browse the current Math and Science lesson library from Kindergarten through Grade 12.</p>
    </section>
    <section aria-label="Search the lesson catalog">
      <div class="course-filters">
        <div class="filter-field filter-search">
          <label for="course-search" data-site-i18n="courses.searchLabel">Search lessons</label>
          <input id="course-search" type="search" autocomplete="off" placeholder="Try fractions, cells, or motion" data-site-i18n-placeholder="courses.searchPlaceholder">
        </div>
        <div class="filter-field">
          <label for="course-subject" data-site-i18n="courses.subjectLabel">Subject</label>
          <select id="course-subject">
            <option value="all" data-site-i18n="courses.allSubjects">All subjects</option>
            <option value="math" data-site-i18n="courses.math">Math</option>
            <option value="science" data-site-i18n="courses.science">Science</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="course-grade" data-site-i18n="courses.gradeLabel">Grade</label>
          <select id="course-grade">
            <option value="all" data-site-i18n="courses.allGrades">All grades</option>
            <option value="0" data-site-i18n="courses.kindergarten">Kindergarten</option>
            <option value="1" data-site-i18n="courses.grade" data-site-i18n-grade="1">Grade 1</option>
            <option value="2" data-site-i18n="courses.grade" data-site-i18n-grade="2">Grade 2</option>
            <option value="3" data-site-i18n="courses.grade" data-site-i18n-grade="3">Grade 3</option>
            <option value="4" data-site-i18n="courses.grade" data-site-i18n-grade="4">Grade 4</option>
            <option value="5" data-site-i18n="courses.grade" data-site-i18n-grade="5">Grade 5</option>
            <option value="6" data-site-i18n="courses.grade" data-site-i18n-grade="6">Grade 6</option>
            <option value="7" data-site-i18n="courses.grade" data-site-i18n-grade="7">Grade 7</option>
            <option value="8" data-site-i18n="courses.grade" data-site-i18n-grade="8">Grade 8</option>
            <option value="9" data-site-i18n="courses.grade" data-site-i18n-grade="9">Grade 9</option>
            <option value="10" data-site-i18n="courses.grade" data-site-i18n-grade="10">Grade 10</option>
            <option value="11" data-site-i18n="courses.grade" data-site-i18n-grade="11">Grade 11</option>
            <option value="12" data-site-i18n="courses.grade" data-site-i18n-grade="12">Grade 12</option>
          </select>
        </div>
        <output id="course-count" class="course-result-count" aria-live="polite" data-site-i18n="courses.loading">Loading lessons</output>
      </div>
      <p id="course-status" class="course-status" role="status" aria-live="polite"></p>
      <div id="course-results" class="course-list" aria-label="Matching lessons"></div>
    </section>
  </main>
  <script type="module" src="courses-page.mjs"></script>
</body>
</html>
