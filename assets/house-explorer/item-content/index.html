<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Audio, video, and images used by the HouseLearning 3D House Explorer.">
	<title>House Explorer Media | HouseLearning</title>
	<script src="/home/analytics.js?v=sitewide-consent-v2" defer></script>
	<style>
		body { margin: 0; color: #172a35; font: 16px/1.5 system-ui, sans-serif; }
		main { width: min(900px, calc(100% - 32px)); margin: 32px auto; }
		.media-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; }
		figure { margin: 0; padding: 14px; border-bottom: 1px solid #cbd8d5; }
		img, video { display: block; width: 100%; height: auto; }
		audio { width: 100%; }
		figcaption { margin-top: 8px; font-weight: 600; }
	</style>
</head>
<body>
	<main>
		<h1>House Explorer media</h1>
		<p>Audio, video, and images used by the 3D House Explorer.</p>
		<p><a href="../index.html">Return to the 3D House Explorer</a></p>
		<section class="media-list" aria-label="House Explorer media resources">
			<figure><audio controls preload="none" src="radio-tune-100.mp3">Audio playback is not supported by this browser.</audio><figcaption>Radio tune, full volume</figcaption></figure>
			<figure><audio controls preload="none" src="radio-tune-66.mp3">Audio playback is not supported by this browser.</audio><figcaption>Radio tune, lower volume</figcaption></figure>
			<figure><video controls preload="metadata" src="tv-video.mp4">Video playback is not supported by this browser.</video><figcaption>House Explorer television clip</figcaption></figure>
			<figure><img src="radio-tune-100.png" alt="Radio tuning display at full volume"><figcaption>Radio tuning display</figcaption></figure>
			<figure><img src="radio-off.png" alt="Radio switched off"><figcaption>Radio switched off</figcaption></figure>
		</section>
	</main>
</body>
</html>
